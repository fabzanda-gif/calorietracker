name: Apply rolling 7-day Home overview

on:
  push:
    branches:
      - codex/landing-redesign
    paths:
      - .github/workflows/rolling-7-day-home-patch.yml

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/landing-redesign
          fetch-depth: 0

      - name: Switch Home overview to rolling 7 days
        shell: python
        run: |
          from pathlib import Path

          path = Path("frontend/components/home/HomeShell.tsx")
          text = path.read_text()

          replacements = [
              (
                  '''  const mondayForWeek = new Date(\n    todayForWeek,\n  );\n\n  mondayForWeek.setDate(\n    todayForWeek.getDate() -\n      ((todayForWeek.getDay() + 6) % 7),\n  );''',
                  '''  const rollingWeekStart = new Date(\n    todayForWeek,\n  );\n\n  rollingWeekStart.setDate(\n    todayForWeek.getDate() - 6,\n  );''',
              ),
              (
                  '''      const date = new Date(mondayForWeek);\n\n      date.setDate(\n        mondayForWeek.getDate() + index,\n      );''',
                  '''      const date = new Date(rollingWeekStart);\n\n      date.setDate(\n        rollingWeekStart.getDate() + index,\n      );''',
              ),
              ('''                      {homeCopy.yourWeek}''', '''                      I tuoi ultimi 7 giorni'''),
              (
                  '''                {weekDetailsLoaded\n                  ? homeCopy.weekIntro\n                  : "Riepilogo leggero. Carica lo storico solo quando ti serve."}''',
                  '''                {weekDetailsLoaded\n                  ? "Una finestra mobile: oggi e i 6 giorni precedenti."\n                  : "Riepilogo leggero degli ultimi 7 giorni. Carica lo storico solo quando ti serve."}''',
              ),
              ('''                    ? "Carico settimana…"\n                    : "Apri dettaglio settimana →"''', '''                    ? "Carico ultimi 7 giorni…"\n                    : "Apri dettaglio 7 giorni →"'''),
              ('''                    <span>{homeCopy.weeklyMeals}</span>''', '''                    <span>Pasti · 7 giorni</span>'''),
              (
                  '''                {weeklyMealDays > 0\n                  ? homeCopy.weekLogged(weeklyMealDays)\n                  : homeCopy.weekEmpty}''',
                  '''                {weeklyMealDays > 0\n                  ? `${weeklyMealDays} giorni con pasti registrati negli ultimi 7.`\n                  : "Gli ultimi 7 giorni inizieranno a prendere forma quando registrerai i pasti."}''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Home snippet not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit rolling overview
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/components/home/HomeShell.tsx
          git commit -m "Use rolling 7-day Home overview"
          git push origin HEAD:codex/landing-redesign
